name: Update Waiver Edge

on:
  workflow_dispatch:
  schedule:
    # Every Wednesday at 10:00 AM UTC (6:00 AM ET during daylight saving time)
    - cron: "0 10 * * 3"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy nflreadpy pyarrow

      - name: Update waiver data
        run: python update.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update weekly waiver data"
          git push
