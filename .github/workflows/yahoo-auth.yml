name: Yahoo League Finder

on:
  workflow_dispatch:

jobs:
  find-leagues:
    runs-on: ubuntu-latest

    steps:
      - name: Find Yahoo Fantasy leagues
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}

        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request
          import urllib.error

          client_id = os.environ["YAHOO_CLIENT_ID"]
          client_secret = os.environ["YAHOO_CLIENT_SECRET"]
          refresh_token = os.environ["YAHOO_REFRESH_TOKEN"]

          redirect_uri = "https://notoriousssss.github.io/waiver-edge/"
          token_url = "https://api.login.yahoo.com/oauth2/get_token"

          credentials = base64.b64encode(
              f"{client_id}:{client_secret}".encode()
          ).decode()

          headers = {
              "Authorization": f"Basic {credentials}",
              "Content-Type": "application/x-www-form-urlencoded",
          }

          data = urllib.parse.urlencode({
              "grant_type": "refresh_token",
              "redirect_uri": redirect_uri,
              "refresh_token": refresh_token,
          }).encode()

          request = urllib.request.Request(
              token_url,
              data=data,
              headers=headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  token = json.loads(response.read())

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print("TOKEN REFRESH FAILED")

              try:
                  error = json.loads(body)
                  print("Yahoo error:", error.get("error"))
                  print(
                      "Yahoo description:",
                      error.get("error_description")
                  )
              except Exception:
                  print("Yahoo HTTP status:", e.code)

              raise

          access_token = token["access_token"]

          print("Yahoo OAuth: SUCCESS")

          # Important:
          # Yahoo may rotate refresh tokens.
          new_refresh = token.get("refresh_token")

          if new_refresh:
              print(f"::add-mask::{new_refresh}")

          url = (
              "https://fantasysports.yahooapis.com/"
              "fantasy/v2/users;use_login=1/"
              "games;game_codes=nfl/leagues"
              "?format=json"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read())

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              
              print("FANTASY API FAILED")
              print("Yahoo HTTP status:", e.code)
              print("Yahoo Fantasy response:")
              print(body)

              raise

          print("Yahoo Fantasy API: SUCCESS")
          print()
          print("========== YOUR YAHOO NFL LEAGUES ==========")

          found = set()

          def walk(obj):
              if isinstance(obj, dict):
                  if "league_key" in obj and "name" in obj:
                      key = str(obj["league_key"])
                      name = str(obj["name"])

                      if key not in found:
                          found.add(key)
                          print(
                              f"LEAGUE: {name} | KEY: {key}"
                          )

                  for value in obj.values():
                      walk(value)

              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)

          walk(result)

          print("============================================")
          print("Total NFL leagues found:", len(found))

          if not found:
              raise RuntimeError(
                  "Yahoo connected successfully, but no NFL leagues were found."
              )
          PY
