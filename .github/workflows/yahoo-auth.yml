name: Yahoo Fresh Authorization Test

on:
  workflow_dispatch:

jobs:
  test-yahoo:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange code and test Fantasy access
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_AUTH_CODE: ${{ secrets.YAHOO_AUTH_CODE }}

        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request
          import urllib.error

          client_id = os.environ["YAHOO_CLIENT_ID"]
          client_secret = os.environ["YAHOO_CLIENT_SECRET"]
          auth_code = os.environ["YAHOO_AUTH_CODE"]

          redirect_uri = "https://notoriousssss.github.io/waiver-edge/"
          token_url = "https://api.login.yahoo.com/oauth2/get_token"

          credentials = base64.b64encode(
              f"{client_id}:{client_secret}".encode()
          ).decode()

          token_headers = {
              "Authorization": f"Basic {credentials}",
              "Content-Type": "application/x-www-form-urlencoded",
          }

          # STEP 1 — Exchange the NEW authorization code
          data = urllib.parse.urlencode({
              "grant_type": "authorization_code",
              "redirect_uri": redirect_uri,
              "code": auth_code,
          }).encode()

          request = urllib.request.Request(
              token_url,
              data=data,
              headers=token_headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  token = json.loads(response.read())

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print("AUTHORIZATION CODE EXCHANGE FAILED")
              print("HTTP status:", e.code)
              print(body)
              raise

          access_token = token["access_token"]
          refresh_token = token.get("refresh_token")

          print(f"::add-mask::{access_token}")

          if refresh_token:
              print(f"::add-mask::{refresh_token}")

          print("Authorization code exchange: SUCCESS")
          print("Refresh token received:", "YES" if refresh_token else "NO")

          # STEP 2 — Test Fantasy API using THIS access token
          # before refreshing anything.
          fantasy_url = (
              "https://fantasysports.yahooapis.com/"
              "fantasy/v2/users;use_login=1/"
              "games;game_codes=nfl/leagues"
              "?format=json"
          )

          fantasy_request = urllib.request.Request(
              fantasy_url,
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(fantasy_request) as response:
                  result = json.loads(response.read())

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")

              print()
              print("FANTASY API TEST: FAILED")
              print("Yahoo HTTP status:", e.code)
              print("Yahoo response:")
              print(body)
              raise

          print("Fantasy API test: SUCCESS")
          print()
          print("========== YOUR YAHOO NFL LEAGUES ==========")

          found = set()

          def walk(obj):
              if isinstance(obj, dict):
                  if "league_key" in obj and "name" in obj:
                      key = str(obj["league_key"])
                      name = str(obj["name"])

                      if key not in found:
                          found.add(key)
                          print(
                              f"LEAGUE: {name} | KEY: {key}"
                          )

                  for value in obj.values():
                      walk(value)

              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)

          walk(result)

          print("============================================")
          print("Total NFL leagues found:", len(found))

          # STEP 3 — Save refresh token ONLY after Fantasy works.
          if not refresh_token:
              raise RuntimeError(
                  "No refresh token was returned by Yahoo."
              )

          with open("yahoo_refresh_token.txt", "w") as f:
              f.write(refresh_token)

          print("Working refresh token saved.")
          PY

      - name: Upload working refresh token
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-working-refresh-token
          path: yahoo_refresh_token.txt
          retention-days: 1
