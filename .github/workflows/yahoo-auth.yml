name: Yahoo Connection Test

on:
  workflow_dispatch:

jobs:
  test-yahoo:
    runs-on: ubuntu-latest

    steps:
      - name: Test Yahoo Fantasy connection
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          # Get a fresh access token using our stored refresh token.
          data = urllib.parse.urlencode({
              "client_id": os.environ["YAHOO_CLIENT_ID"],
              "client_secret": os.environ["YAHOO_CLIENT_SECRET"],
              "refresh_token": os.environ["YAHOO_REFRESH_TOKEN"],
              "grant_type": "refresh_token",
          }).encode()

          req = urllib.request.Request(
              "https://api.login.yahoo.com/oauth2/get_token",
              data=data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )

          with urllib.request.urlopen(req) as response:
              token = json.loads(response.read())

          access_token = token["access_token"]

          print("Yahoo OAuth: SUCCESS")

          # Ask Yahoo for the logged-in user's NFL leagues.
          url = (
              "https://fantasysports.yahooapis.com/"
              "fantasy/v2/users;use_login=1/games;game_codes=nfl/leagues"
              "?format=json"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
              },
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read())

          print("Yahoo Fantasy API: SUCCESS")
          print()
          print("----- YAHOO LEAGUES -----")

          users = result["fantasy_content"]["users"]

          def walk(obj):
              if isinstance(obj, dict):
                  if "league_key" in obj and "name" in obj:
                      print(
                          "League:",
                          obj.get("name"),
                          "| League Key:",
                          obj.get("league_key")
                      )

                  for value in obj.values():
                      walk(value)

              elif isinstance(obj, list):
                  for value in obj:
                      walk(value)

          walk(users)

          print("-------------------------")
          PY
