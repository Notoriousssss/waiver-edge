name: Yahoo Token Setup

on:
  workflow_dispatch:

jobs:
  yahoo-token:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange and verify Yahoo token
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_AUTH_CODE: ${{ secrets.YAHOO_AUTH_CODE }}

        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.parse
          import urllib.request
          import urllib.error

          client_id = os.environ["YAHOO_CLIENT_ID"]
          client_secret = os.environ["YAHOO_CLIENT_SECRET"]
          auth_code = os.environ["YAHOO_AUTH_CODE"]

          redirect_uri = "https://notoriousssss.github.io/waiver-edge/"
          token_url = "https://api.login.yahoo.com/oauth2/get_token"

          # Yahoo's documented confidential-client authentication.
          credentials = base64.b64encode(
              f"{client_id}:{client_secret}".encode()
          ).decode()

          headers = {
              "Authorization": f"Basic {credentials}",
              "Content-Type": "application/x-www-form-urlencoded",
          }

          # STEP 1: Exchange authorization code.
          data = urllib.parse.urlencode({
              "grant_type": "authorization_code",
              "redirect_uri": redirect_uri,
              "code": auth_code,
          }).encode()

          request = urllib.request.Request(
              token_url,
              data=data,
              headers=headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  token = json.loads(response.read())

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print("AUTH CODE EXCHANGE FAILED")

              try:
                  error = json.loads(body)
                  print("Yahoo error:", error.get("error"))
                  print(
                      "Yahoo description:",
                      error.get("error_description")
                  )
              except Exception:
                  print("Yahoo HTTP status:", e.code)

              raise

          refresh_token = token.get("refresh_token")

          if not refresh_token:
              raise RuntimeError("Yahoo did not return a refresh token.")

          print("Authorization code exchange: SUCCESS")
          print("Refresh token received: YES")

          # Mask the token before doing anything else.
          print(f"::add-mask::{refresh_token}")

          # STEP 2: Immediately verify that refresh token.
          refresh_data = urllib.parse.urlencode({
              "grant_type": "refresh_token",
              "redirect_uri": redirect_uri,
              "refresh_token": refresh_token,
          }).encode()

          refresh_request = urllib.request.Request(
              token_url,
              data=refresh_data,
              headers=headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(refresh_request) as response:
                  refreshed = json.loads(response.read())

          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              print("REFRESH TOKEN TEST FAILED")

              try:
                  error = json.loads(body)
                  print("Yahoo error:", error.get("error"))
                  print(
                      "Yahoo description:",
                      error.get("error_description")
                  )
              except Exception:
                  print("Yahoo HTTP status:", e.code)

              raise

          print("Refresh token verification: SUCCESS")
          print("Fresh access token received: YES")

          # Yahoo can rotate refresh tokens.
          final_refresh = refreshed.get(
              "refresh_token",
              refresh_token
          )

          print(f"::add-mask::{final_refresh}")

          with open("yahoo_refresh_token.txt", "w") as f:
              f.write(final_refresh)

          print("Verified refresh token saved for download.")
          PY

      - name: Upload verified refresh token
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-verified-refresh-token
          path: yahoo_refresh_token.txt
          retention-days: 1
